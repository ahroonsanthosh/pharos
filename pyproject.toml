[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pharos"
version = "0.1.0"
description = "Absolute visual localization of drone video against satellite imagery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "pyproj>=3.6"]  # GeoTIFF maps and CRS conversion
server = [  # pharos serve: live feeds and dashboard
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pymavlink>=2.4",
]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
pharos = "pharos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pharos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = ["N803", "N806"]  # matrix names like K, R, H are conventional

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs (deselect with -m 'not slow')"]
